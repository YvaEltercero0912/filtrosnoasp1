<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #140038;
        }

        .login-container {
            width: 350px; /* Ajustado el ancho del contenedor */
            padding: 30px; /* Ajustado el padding interno */
            background-color: #05000e7a;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-container img {
            width: 150px; /* Ajusta el tamaño del logo */
            margin-bottom: 20px;
        }

        h2 {
            color: #FFD700; /* Color de texto amarillo */
            margin-bottom: 20px;
        }

        label {
            color: #FFD700; /* Color amarillo para las etiquetas */
            font-weight: bold;
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input[type="text"], input[type="password"] {
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #FFD700; /* Borde amarillo */
            border-radius: 4px;
            background-color: transparent;
            color: #FFD700; /* Color de texto amarillo */
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #FFD700; /* Botón amarillo */
            color: #2d0147; /* Texto oscuro */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #FFC700;
        }

        .login-container p {
            color: #FFD700;
            font-size: 14px;
        }

        .login-container a {
            color: #FFD700;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        #error {
            color: red;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <a href="index.html">
    <img src="img/logoamarillo.png" alt="Logo de Filtros Noa"></a>
    
    <h2>Iniciar Sesión</h2>
    
    <form id="loginForm">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>

        <input type="submit" value="Ingresar">
    </form>

    <p id="error">Usuario o contraseña incorrectos</p>
    
    
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Usuario y contraseña correctos
        const correctUsername = 'admin';
        const correctPassword = '1234';

        if (username === correctUsername && password === correctPassword) {
            window.location.href = 'adm.html'; // Redirige a adm.html
        } else {
            document.getElementById('error').style.display = 'block'; // Muestra el error
        }
    });
</script>

</body>
</html>
