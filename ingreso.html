<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso</title>
    <link rel="stylesheet" href="ingreso.css">
</head>
<body>
    <div class="container">
        <a href="index.html">
            <img class="logo1" src="img/logoamarillo.png" alt="Logo">
        </a>
        <h2>Iniciar Sesión</h2>
        <form id="formIngreso">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>

    <script>
        document.getElementById('formIngreso').addEventListener('submit', function(e) {
            e.preventDefault();

            // Definir usuario y contraseña válidos
            const usuarioValido = "admin";  // Cambia este valor si deseas otro usuario
            const passwordValido = "contraseña";  // Cambia este valor si deseas otra contraseña

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            if (usuario === usuarioValido && password === passwordValido) {
                // Guardar estado de autenticación
                sessionStorage.setItem('usuarioAutenticado', true);
                // Redirigir a la página de administración
                window.location.href = 'admin.html';  // Asegúrate de que esta ruta sea correcta
            } else {
                alert("Usuario o contraseña incorrectos");
            }
        });
    </script>
</body>
</html>
